name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit + static tests, coverage, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test:unit

      - name: Static tests
        run: bun run test:static

      - name: QA critical gate (regression-proof critical paths)
        run: bun run qa:critical

      - name: QA manifest verify (schema + sha256 + gates)
        run: bun run qa:manifest:verify

      - name: Build
        run: bun run build

      - name: Check required QA artifact files
        run: |
          missing=0
          for f in qa-summary.json qa-summary.sha256 QA_SUMMARY.md RELEASE_NOTES.md; do
            if [ ! -f "$f" ]; then
              echo "::error title=Missing QA artifact::$f is required but not found"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Enforce QA artifact retention policy (must be 90 days)
        run: |
          EXPECTED=90
          WORKFLOW_FILE=".github/workflows/ci.yml"
          # Extract the retention-days value from the QA upload step block
          ACTUAL=$(awk '
            /name: erpovo-ci-qa-summary-/ { inblock=1 }
            inblock && /retention-days:/ {
              gsub(/[^0-9]/, "", $2); print $2; exit
            }
          ' "$WORKFLOW_FILE")

          echo "Retention expected: ${EXPECTED} days"
          echo "Retention actual  : ${ACTUAL} days"

          {
            echo "### ERPOVO CI Artifact Retention Gate"
            echo ""
            echo "- **Retention expected:** ${EXPECTED} days"
            echo "- **Retention actual:** ${ACTUAL} days"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "- **Retention check:** FAIL" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Retention policy violation::Artifact retention must be 90 days (found: ${ACTUAL})"
            echo "Artifact retention must be 90 days"
            exit 1
          fi
          echo "- **Retention check:** PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Retention check: PASS"

      - name: QA artifact summary
        run: |
          HASH=$(awk '{print $1}' qa-summary.sha256)
          READY=$(grep -o '"release_ready"[[:space:]]*:[[:space:]]*[a-z]*' qa-summary.json | head -n1 | awk -F: '{print $2}' | tr -d ' ')
          ARTIFACT_NAME="erpovo-ci-qa-summary-${{ github.sha }}"
          REQUIRED="qa-summary.json qa-summary.sha256 QA_SUMMARY.md RELEASE_NOTES.md"
          OPTIONAL_FIXED="stable-build-manifest.json"
          OPTIONAL_GLOBS="erpovo-release-audit*.pdf release-audit*.pdf"
          FORBIDDEN=".env .env.* *.pem *secret* *token* *api_key* node_modules perf_stress*"
          RETENTION_DAYS=90

          echo "========== ERPOVO CI QA Artifact Checks =========="
          echo "Artifact name  : $ARTIFACT_NAME"
          echo "Retention      : $RETENTION_DAYS days"
          echo "Manifest path  : qa-summary.json"
          echo "Hash file path : qa-summary.sha256"
          echo "SHA-256        : $HASH"
          echo "Release ready  : $READY"
          echo ""
          echo "Required files :"
          for f in $REQUIRED; do
            if [ -f "$f" ]; then echo "  ✓ present : $f"; else echo "  ✗ MISSING : $f"; fi
          done
          echo ""
          echo "Optional files :"
          for f in $OPTIONAL_FIXED; do
            if [ -f "$f" ]; then echo "  ✓ present : $f"; else echo "  · skipped : $f (not found)"; fi
          done
          for pat in $OPTIONAL_GLOBS; do
            matched=0
            for f in $pat; do
              if [ -f "$f" ]; then echo "  ✓ present : $f"; matched=1; fi
            done
            [ "$matched" -eq 0 ] && echo "  · skipped : $pat (no match)"
          done
          echo ""
          echo "Upload paths   :"
          for p in $REQUIRED $OPTIONAL_FIXED $OPTIONAL_GLOBS; do
            echo "  - $p"
          done
          echo ""
          echo "Secrets excluded confirmation:"
          for pat in $FORBIDDEN; do
            for f in $pat; do
              [ -e "$f" ] && { echo "  ⚠ forbidden present in repo (NOT uploaded): $f"; }
            done
          done
          echo "  ✓ Upload list contains no .env / secrets / tokens / node_modules / PERF stress data"
          echo ""
          echo "QA artifacts retained for $RETENTION_DAYS days"
          echo "==================================================="

          {
            echo "### ERPOVO CI QA Artifact Checks"
            echo ""
            echo "- **Artifact name:** \`$ARTIFACT_NAME\`"
            echo "- **Retention period:** $RETENTION_DAYS days"
            echo "- **Manifest hash (sha256):** \`$HASH\`"
            echo "- **Release ready:** $READY"
            echo ""
            echo "**Required files:**"
            for f in $REQUIRED; do
              if [ -f "$f" ]; then echo "- ✓ \`$f\`"; else echo "- ✗ MISSING \`$f\`"; fi
            done
            echo ""
            echo "**Optional files:**"
            for f in $OPTIONAL_FIXED; do
              if [ -f "$f" ]; then echo "- ✓ \`$f\`"; else echo "- · skipped \`$f\`"; fi
            done
            for pat in $OPTIONAL_GLOBS; do
              matched=0
              for f in $pat; do
                if [ -f "$f" ]; then echo "- ✓ \`$f\`"; matched=1; fi
              done
              [ "$matched" -eq 0 ] && echo "- · skipped \`$pat\`"
            done
            echo ""
            echo "**Secrets excluded:** ✓ no .env / secrets / tokens / node_modules / PERF stress data in upload list"
            echo ""
            echo "_QA artifacts retained for $RETENTION_DAYS days_"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Upload QA release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: erpovo-ci-qa-summary-${{ github.sha }}
          path: |
            qa-summary.json
            qa-summary.sha256
            QA_SUMMARY.md
            RELEASE_NOTES.md
            stable-build-manifest.json
            erpovo-release-audit*.pdf
            release-audit*.pdf
          if-no-files-found: ignore
          # qa-retention-policy: enforced
          retention-days: 90


      - name: Coverage report (non-blocking)
        run: bun run test:coverage
        continue-on-error: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: Playwright E2E (optional)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on push to main or manual dispatch — never on fork PRs where
    # secrets are not exposed. The wrapper script also skips cleanly when
    # the required env vars are missing, so this job always exits green.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_COMPANY_ID: ${{ secrets.E2E_COMPANY_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect E2E configuration
        id: detect
        run: |
          if [ -n "${E2E_OWNER_PASSWORD:-}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=E2E skipped::Required E2E secrets are not configured for this repository. Add them under Settings → Secrets and variables → Actions to enable Playwright runs."
          fi

      - name: Cache Playwright browsers
        if: steps.detect.outputs.configured == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.detect.outputs.configured == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Run E2E (safe wrapper)
        run: bash scripts/run-e2e.sh --skip-if-unconfigured

      - name: Run E2E smoke (safe wrapper)
        run: bash scripts/run-e2e-smoke.sh --skip-if-unconfigured

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-smoke/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
