<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - ERPOVO</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f8fafc;
        color: #1e293b;
        text-align: center;
      }
      .container {
        max-width: 400px;
        padding: 2rem;
        background: white;
        border-radius: 1rem;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
      h1 {
        color: #0ea5e9;
        margin-bottom: 0.5rem;
      }
      p {
        color: #64748b;
        line-height: 1.5;
      }
      .icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      .button {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.5rem 1rem;
        background-color: #0ea5e9;
        color: white;
        text-decoration: none;
        border-radius: 0.375rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📶❌</div>
      <h1>You are offline</h1>
      <p>Please reconnect to the internet to sync your ERP data and continue using ERPOVO.</p>
      <a href="/" class="button">Try Again</a>
    </div>
  </body>
</html>
